name: Android build and file receiving tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci && npm test && npm run test:android-files && npm run build
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease assembleDebug assembleAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-build
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Enable KVM for emulator
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest || { adb logcat -d -s Zhuanyixia:V chromium:E; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-receive-test-report
          path: android/app/build/reports/androidTests/
