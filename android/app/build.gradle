plugins { id 'com.android.application' }
android {
    namespace 'io.github.douglassdjudahsd.zhuanyixia'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.douglassdjudahsd.zhuanyixia'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    buildTypes { release { minifyEnabled false } }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ['gz', 'wasm', 'bcmap'] }
}
tasks.register('bundleWeb', Sync) {
    from '../../dist'
    into 'src/main/assets/www'
    exclude 'sw.js', 'sw-assets.json'
    doFirst { if (!file('../../dist/index.html').exists()) throw new GradleException('Run npm ci && npm run build in the repository root first.') }
}
tasks.named('preBuild').configure { dependsOn 'bundleWeb' }
// Android's legacy instrumentation runner is supplied by the system, not the APK.
dependencies {
    androidTestCompileOnly files("${android.sdkDirectory}/platforms/android-34/optional/android.test.runner.jar", "${android.sdkDirectory}/platforms/android-34/optional/android.test.base.jar", "${android.sdkDirectory}/platforms/android-34/optional/android.test.mock.jar")
}
